name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to release, e.g. 1.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          cache: true
      - run: dotnet restore Veritas.sln
      - run: dotnet build Veritas.sln --configuration Release --no-restore
      - run: dotnet test tests/Veritas.Tests/Veritas.Tests.csproj --configuration Release --no-build
      - run: dotnet test tests/Veritas.IntegrationTests/Veritas.IntegrationTests.csproj --configuration Release --no-build

  # ---------------------------------------------------------------------------
  # The approval gate. `environment: production` maps to a GitHub Environment that
  # is configured with required reviewers, so this job pauses until a human approves
  # it. Nothing below this point runs until that happens.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: verify
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: VERITAS v${{ inputs.version }}
          generate_release_notes: true
          body: |
            Image: `ghcr.io/${{ github.repository }}:${{ inputs.version }}`

            Approved by ${{ github.actor }} through the `production` environment gate.
