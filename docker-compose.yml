services:
  veritas:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Compose is the local/demo profile. It enables the Development seed and
      # allows the secure Identity cookie to be used over the exposed HTTP port.
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Postgres=Host=postgres;Database=veritas;Username=${POSTGRES_USER:-veritas};Password=${POSTGRES_PASSWORD:?set in .env}
      - ConnectionStrings__Redis=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=veritas
      - POSTGRES_USER=${POSTGRES_USER:-veritas}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - veritas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veritas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

volumes:
  veritas_pgdata:
